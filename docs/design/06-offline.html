<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ШІ-Репетитор — Немає зв'язку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"]{
    --bg:#FAF6EF; --surface:#FFFFFF; --surface-alt:#F1ECE0; --text:#2B2A28; --text-muted:#6B6862;
    --primary:#FF7A50; --secondary:#2EC4B6; --accent:#7C6CF0; --warn:#E8A33D; --border:#E7E0D2;
  }
  :root[data-theme="dark"]{
    --bg:#15141C; --surface:#1F1E28; --surface-alt:#2A2833; --text:#F3F1EC; --text-muted:#A9A6A0;
    --primary:#FF9470; --secondary:#3DDBC9; --accent:#9A8CFF; --warn:#F0B95A; --border:#37353F;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); padding:24px;}
  .theme-toggle{position:fixed; top:12px; right:12px; z-index:80; display:flex; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px; box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .theme-toggle button{border:none; background:transparent; color:var(--text); font-family:inherit; font-weight:700; font-size:12px; padding:7px 12px; border-radius:999px; cursor:pointer;}
  .theme-toggle button.active{background:var(--primary); color:white;}
  .card{background:var(--surface); border-radius:28px; padding:44px 36px; max-width:440px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.08);}
  .cloud{font-size:64px; margin-bottom:16px; opacity:.85;}
  h1{font-size:24px; margin:0 0 10px;}
  p{color:var(--text-muted); font-size:16px; line-height:1.5; margin:0 0 24px;}
  .step-card{display:flex; gap:12px; align-items:center; background:var(--surface-alt); border-radius:16px; padding:14px 16px; text-align:left; margin-bottom:10px;}
  .step-card .n{width:28px; height:28px; border-radius:50%; background:var(--secondary); color:white; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none;}
  .step-card b{display:block; font-size:14px;}
  .step-card span{font-size:12px; color:var(--text-muted);}
  .retry-note{margin-top:20px; font-size:13px; color:var(--text-muted);}
  .dots{display:flex; gap:6px; justify-content:center; margin-top:6px;}
  .dots span{width:6px; height:6px; border-radius:50%; background:var(--text-muted); animation:blink 1.4s infinite ease-in-out both;}
  .dots span:nth-child(2){animation-delay:.2s;} .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
</style>
</head>
<body data-theme="light">
  <div class="theme-toggle">
    <button id="btn-light" class="active" onclick="setTheme('light')">☀️</button>
    <button id="btn-dark" onclick="setTheme('dark')">🌙</button>
  </div>
  <div class="card">
    <div class="cloud">☁️✕</div>
    <h1>Немає зв'язку</h1>
    <p>Усе збережено. Продовжимо, щойно з'явиться інтернет.</p>

    <div class="step-card"><div class="n">✓</div><div><b>Крок 3 з 6 збережено</b><span>Математика · Дроби</span></div></div>
    <div class="step-card"><div class="n">✓</div><div><b>Твоя остання відповідь на місці</b><span>надішлемо автоматично, коли з'явиться мережа</span></div></div>

    <div class="retry-note">Перевіряємо з'єднання<div class="dots"><span></span><span></span><span></span></div></div>
  </div>
<script>
  function setTheme(t){
    document.body.setAttribute('data-theme', t);
    document.getElementById('btn-light').classList.toggle('active', t==='light');
    document.getElementById('btn-dark').classList.toggle('active', t==='dark');
  }
</script>
</body>
</html>
